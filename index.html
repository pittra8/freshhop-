<!-- Add this where you want the search feature to appear -->
<div id="place-search-section">
  <button id="find-places-btn">Find Local Restaurants & Stores</button>
  <p id="place-search-status"></p>
  <div id="place-results"></div>
</div>

<script>
  document.getElementById('find-places-btn').addEventListener('click', async () => {
    const statusEl = document.getElementById('place-search-status');
    const resultsEl = document.getElementById('place-results');

    statusEl.textContent = 'Searching nearby places...';
    resultsEl.innerHTML = '';

    try {
      const res = await fetch('/.netlify/functions/search-places?lat=45.7809&lng=-122.5334&radius=5000');
      const data = await res.json();

      if (data.error) {
        statusEl.textContent = 'Something went wrong: ' + data.error;
        return;
      }

      const places = data.results || [];
      statusEl.textContent = `Found ${places.length} places near Battle Ground.`;

      resultsEl.innerHTML = places
        .map(place => `
          <div class="place-card">
            <h3>${place.name}</h3>
            <p>${place.address || 'Address not listed'}</p>
            <p><em>${place.category || ''}</em></p>
            ${place.phone ? `<p>📞 ${place.phone}</p>` : ''}
            ${place.website ? `<p><a href="${place.website}" target="_blank">Website</a></p>` : ''}
          </div>
        `)
        .join('');
    } catch (err) {
      statusEl.textContent = 'Failed to load places. Please try again.';
    }
  });
</script>

<style>
  #place-results {
    display: grid;
    gap: 1rem;
    margin-top: 1rem;
  }
  .place-card {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 1rem;
  }
  .place-card h3 {
    margin: 0 0 0.5rem 0;
  }
</style>
