<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order — FreshHop</title>
<style>
  :root {
    --green: #2e8b57;
    --green-dark: #236941;
    --bg: #f7f9f7;
    --border: #d8ded9;
    --text: #222;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 0 0 60px;
  }
  header {
    background: var(--green);
    color: white;
    padding: 20px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 1.4rem; }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px;
  }
  .card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 0.85rem;

<body>

<header>
  <h1>🐰 FreshHop</h1>
</header>

<main>
  <div id="orderForm">
    <form id="bookingForm">

      <div class="card">
        <label for="placeSearch">Where do you want to order from?</label>
        <input type="text" id="placeSearch" placeholder="Search restaurants & stores nearby..." autocomplete="off">
        <div id="placeResults"></div>
        <div class="selected-place" id="selectedPlace">
          <div class="name" id="selectedPlaceName"></div>
          <div class="addr" id="selectedPlaceAddr"></div>
          <button type="button" id="changePlace">Change</button>
        </div>
      </div>

      <div class="card">
        <label>Pickup or delivery?</label>
        <div class="toggle-row">
          <button type="button" class="active" id="pickupBtn">Pickup</button>
          <button type="button" id="deliveryBtn">Delivery</button>
        </div>

        <div id="deliveryFields">
          <label for="deliveryAddress">Delivery address</label>
          <input type="text" id="deliveryAddress" placeholder="123 Main St, Battle Ground, WA">
        </div>

        <label for="customerName">Your name</label>
        <input type="text" id="customerName" required>

        <label for="customerPhone">Phone number</label>
        <input type="tel" id="customerPhone" required placeholder="(360) 555-0123">

        <label for="notes">What would you like to order?</label>
        <textarea id="notes" placeholder="e.g. Two burritos, one with no onions, and a large horchata" required></textarea>

        <label for="timeSlot">When?</label>
        <select id="timeSlot">
          <option value="asap">As soon as possible</option>
          <option value="30min">In 30 minutes</option>
          <option value="1hour">In 1 hour</option>
          <option value="later">Later today</option>
        </select>
      </div>

      <button type="submit" id="submitBtn" disabled>Select a place to order from</button>
      <div id="statusMsg"></div>
    </form>
  </div>

  <div id="confirmation">
    <h2>Order sent! 🎉</h2>
    <p>We've got your order for <strong id="confirmPlaceName"></strong> and we're getting it started.</p>
    <p>We'll reach out at <strong id="confirmPhone"></strong> if anything comes up.</p>
  </div>
</main>

<script>
  let selectedPlace = null;
  let fulfillmentType = "pickup";
  let searchTimeout = null;

  const placeSearch = document.getElementById("placeSearch");
  const placeResults = document.getElementById("placeResults");
  const selectedPlaceEl = document.getElementById("selectedPlace");
  const submitBtn = document.getElementById("submitBtn");

  placeSearch.addEventListener("input", () => {
    clearTimeout(searchTimeout);
    const query = placeSearch.value.trim();
    if (query.length < 2) {
      placeResults.style.display = "none";
      return;
    }
    searchTimeout = setTimeout(() => searchPlaces(query), 400);
  });

  async function searchPlaces(query) {
    try {
      const res = await fetch(`/.netlify/functions/search-places?q=${encodeURIComponent(query)}`);
      const data = await res.json();
      const results = data.results || data || [];
      renderResults(results);
    } catch (err) {
      placeResults.innerHTML = `<div class="place-result">Couldn't load results — try again</div>`;
      placeResults.style.display = "block";
    }
  }

  function renderResults(results) {
    if (!results.length) {
      placeResults.innerHTML = `<div class="place-result">No places found</div>`;
      placeResults.style.display = "block";
      return;
    }
    placeResults.innerHTML = results.map((r, i) => `
      <div class="place-result" data-index="${i}">
        <div class="name">${escapeHtml(r.name || "Unnamed")}</div>
        <div class="addr">${escapeHtml(r.address || "")}</div>
      </div>
    `).join("");
