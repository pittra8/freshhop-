<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FreshHop — Deliveries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7F5EF;
    --leaf:#28503B;
    --leaf-dark:#193226;
    --citrus:#E8763A;
    --ink:#1C211D;
    --muted:#6E756E;
    --line:#DAD5C6;
    --card:#FFFFFF;
    --radius:10px;
    --warn-bg:#FBEAE3;
    --warn-line:#F0C4AE;
    --warn-ink:#8A3A1B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);}
  body{font-family:'IBM Plex Sans', sans-serif;font-size:15px;line-height:1.5;padding:0 0 64px;}
  .wrap{max-width:560px;margin:0 auto;padding:24px 18px 0;}
  header.hero{padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:20px;display:flex;justify-content:space-between;align-items:baseline;}
  .wordmark{font-family:'Fraunces', serif;font-weight:600;font-size:26px;color:var(--leaf-dark);}
  .refresh-btn{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-family:inherit;font-size:13px;color:var(--muted);cursor:pointer;}
  .section-label{font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px;}
  .order-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;overflow:hidden;}
  .order-head{padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;}
  .order-head-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .order-store{font-family:'Fraunces', serif;font-weight:500;font-size:17px;color:var(--leaf-dark);}
  .order-meta{font-size:12.5px;color:var(--muted);margin-top:3px;}
  .status-pill{font-size:11.5px;padding:3px 9px;border-radius:20px;background:#EAF2EB;color:var(--leaf-dark);font-weight:500;white-space:nowrap;}
  .status-pill.awaiting_payment{background:#FCF2E4;color:#8A5A1B;}
  .status-pill.out_for_delivery,.status-pill.ready{background:#E5EEF7;color:#1B4E8A;}
  .order-body{padding:14px 16px 16px;display:none;}
  .order-body.open{display:block;}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-bottom:6px;}
  .detail{font-size:13.5px;}
  .detail .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;}
  .detail .v{font-weight:500;}
  .detail.full{grid-column:1 / -1;}
  .fee-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
  .fee-label{font-size:13px;color:var(--muted);}
  .fee-value{font-family:'Fraunces', serif;font-weight:600;font-size:20px;color:var(--leaf-dark);}
  .fee-input{width:90px;padding:8px;border:1px solid var(--line);border-radius:7px;font-family:inherit;font-size:15px;text-align:right;}
  .action-row{display:flex;gap:8px;margin-top:14px;}
  .btn{flex:1;padding:11px;border-radius:var(--radius);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);}
  .btn.primary{background:var(--leaf);color:#fff;border-color:var(--leaf);}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .contact-line{font-size:13px;color:var(--muted);margin-top:8px;}
  .contact-line a{color:var(--leaf-dark);}
  .pay-link-box{margin-top:12px;padding:12px 14px;border-radius:var(--radius);background:#EEF0FF;border:1px solid #C9CEF5;font-size:13.5px;}
  .pay-link-box a.paybtn{display:inline-block;margin-top:8px;margin-right:8px;padding:9px 14px;background:#635bff;color:#fff;text-decoration:none;border-radius:8px;font-size:13.5px;}
  .pay-link-box a.smsbtn{display:inline-block;margin-top:8px;padding:9px 14px;background:#fff;color:#1C211D;text-decoration:none;border-radius:8px;font-size:13.5px;border:1px solid #C9CEF5;}
  .status{margin-top:10px;padding:9px 11px;border-radius:8px;font-size:13px;display:none;}
  .status.show{display:block;}
  .status.ok{background:#EAF2EB;color:var(--leaf-dark);border:1px solid #C7DBC9;}
  .status.err{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .form-grid label{display:block;font-size:12.5px;color:var(--muted);}
  .form-grid label.full{grid-column:1 / -1;}
  .form-grid input,.form-grid select{width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;color:var(--ink);background:#fff;}
  .empty{color:var(--muted);text-align:center;padding:40px 20px;font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="wordmark">Deliveries</div>
    <button class="refresh-btn" id="refresh">Refresh</button>
  </header>
  <div class="order-card">
    <div class="order-head" id="new-order-toggle">
      <div class="order-head-top">
        <div>
          <div class="order-store">+ New pickup order</div>
          <div class="order-meta">Customer paid the store — enter pickup details</div>
        </div>
      </div>
    </div>
    <div class="order-body open" id="new-order-body">
      <div class="form-grid">
        <label>Customer name<input id="f-name" type="text" placeholder="Jane Doe"></label>
        <label>Customer phone<input id="f-phone" type="tel" placeholder="(555) 123-4567"></label>
        <label>Store<input id="f-store" type="text" placeholder="Fred Meyer"></label>
        <label>Pickup code<input id="f-code" type="text" placeholder="Store order #"></label>
        <label>Pickup window<input id="f-window" type="text" placeholder="Today 4–5 PM"></label>
        <label>Mode<select id="f-mode"><option value="delivery">Deliver to customer</option><option value="pickup">Customer picks up</option></select></label>
        <label class="full">Delivery address<input id="f-address" type="text" placeholder="Street, city"></label>
        <label>Delivery fee ($)<input id="f-fee" type="number" step="0.01" min="0" value="9.99"></label>
      </div>
      <div class="action-row">
        <button class="btn primary" id="create-order">Create pickup order</button>
      </div>
      <div class="status" id="new-order-status"></div>
    </div>
  </div>
  <div class="section-label">Open orders</div>
  <div id="orders-container"><div class="empty">Loading orders…</div></div>
</div>
<script>
  const SUPABASE_URL = 'https://samjaswvvtcmldatyncs.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhbWphc3d2dnRjbWxkYXR5bmNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMzg5NDgsImV4cCI6MjEwMzYxNDk0OH0.vHDCFyBZkq3rJ5pyBgrSp2MXkqtB6bHof-73JzzC6Yc';
  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json'
  };
  const container = document.getElementById('orders-container');
  document.getElementById('new-order-toggle').addEventListener('click', () => {
    document.getElementById('new-order-body').classList.toggle('open');
  });
  document.getElementById('refresh').addEventListener('click', loadOrders);
  document.getElementById('create-order').addEventListener('click', createOrder);
  async function loadOrders(){
    container.innerHTML = '<div class="empty">Loading orders…</div>';
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/orders?order_type=eq.shopping_list&status=in.(confirmed,preparing,awaiting_payment)&order=created_at.asc`,
        { headers }
      );
      if(!res.ok) throw new Error('failed to load orders');
      const orders = await res.json();
      if(orders.length === 0){
        container.innerHTML = '<div class="empty">No open orders right now.</div>';
        return;
      }
      container.innerHTML = '';
      orders.forEach(order => container.appendChild(renderOrderCard(order)));
    } catch(err){
      container.innerHTML = '<div class="empty">Could not load orders.<br><small>Check your connection and anon key.</small></div>';
    }
  }
  function actionLabel(order){
    if(order.status === 'awaiting_payment') return order.mode === 'pickup' ? 'Check payment & mark ready' : 'Check payment & mark for delivery';
    return 'Confirm fee & send payment link';
  }
  function renderOrderCard(order){
    const card = document.createElement('div');
    card.className = 'order-card';
    const fee = Number(order.final_total || 0);
    const head = document.createElement('div');
    head.className = 'order-head';
    const codePart = order.pickup_code ? 'Code ' + order.pickup_code : '';
    const windowPart = order.pickup_window || '';
    head.innerHTML = `
      <div class="order-head-top">
        <div>
          <div class="order-store">${escapeHtml(order.store_name || 'Unnamed store')}</div>
          <div class="order-meta">${escapeHtml(codePart)}${codePart && windowPart ? ' · ' : ''}${escapeHtml(windowPart)}${(codePart || windowPart) ? ' · ' : ''}${escapeHtml(order.customer_name || 'Unknown customer')} · $${fee.toFixed(2)}</div>
        </div>
        <div class="status-pill ${order.status}">${order.status.replace(/_/g,' ')}</div>
      </div>`;
    const body = document.createElement('div');
    body.className = 'order-body';
    head.addEventListener('click', () => body.classList.toggle('open'));
    const details = document.createElement('div');
    details.className = 'detail-grid';
    details.innerHTML = `
      <div class="detail"><div class="k">Customer</div><div class="v">${escapeHtml(order.customer_name || '—')}</div></div>
      <div class="detail"><div class="k">Phone</div><div class="v">${escapeHtml(order.customer_phone || '—')}</div></div>
      <div class="detail"><div class="k">Store</div><div class="v">${escapeHtml(order.store_name || '—')}</div></div>
      <div class="detail"><div class="k">Pickup code</div><div class="v">${escapeHtml(order.pickup_code || '—')}</div></div>
      <div class="detail"><div class="k">Pickup window</div><div class="v">${escapeHtml(order.pickup_window || '—')}</div></div>
      <div class="detail"><div class="k">Mode</div><div class="v">${escapeHtml(order.mode || 'delivery')}</div></div>
      ${order.mode === 'delivery' ? `<div class="detail full"><div class="k">Delivery address</div><div class="v">${escapeHtml(order.delivery_address || '—')}</div></div>` : ''}
    `;
    body.appendChild(details);
    if(order.customer_phone){
      const contact = document.createElement('div');
      contact.className = 'contact-line';
      contact.innerHTML = `<a href="tel:${escapeHtml(order.customer_phone)}">Call customer</a>`;
      body.appendChild(contact);
    }
    const feeRow = document.createElement('div');
    feeRow.className = 'fee-row';
    if(order.status === 'awaiting_payment'){
      feeRow.innerHTML = `<div class="fee-label">Delivery fee</div><div class="fee-value">$${fee.toFixed(2)}</div>`;
    } else {
      feeRow.innerHTML = `<div class="fee-label">Delivery fee</div><input class="fee-input" type="number" step="0.01" min="0" value="${fee.toFixed(2)}">`;
    }
    body.appendChild(feeRow);
    const feeInput = feeRow.querySelector('.fee-input');
    const payLinkBox = document.createElement('div');
    payLinkBox.className = 'pay-link-box';
    payLinkBox.style.display = 'none';
    body.appendChild(payLinkBox);
    if(order.status === 'awaiting_payment' && order.payment_link_url){
      renderPayLink(payLinkBox, order);
    }
    const statusMsg = document.createElement('div');
    statusMsg.className = 'status';
    const actionRow = document.createElement('div');
    actionRow.className = 'action-row';
    const confirmBtn = document.createElement('button');
    confirmBtn.type = 'button';
    confirmBtn.className = 'btn primary';
    confirmBtn.textContent = actionLabel(order);
    confirmBtn.addEventListener('click', async () => {
      if(order.status === 'awaiting_payment'){
        await checkPaymentAndDeliver(order, statusMsg, confirmBtn, card);
      } else {
        await confirmFeeAndSendLink(order, feeInput, statusMsg, confirmBtn, payLinkBox, card);
      }
    });
    actionRow.appendChild(confirmBtn);
    body.appendChild(actionRow);
    body.appendChild(statusMsg);
    card.appendChild(head);
    card.appendChild(body);
    return card;
  }
  function renderPayLink(box, order){
    const fee = Number(order.final_total || 0);
    const url = order.payment_link_url;
    box.style.display = 'block';
    const sms = order.customer_phone
      ? `<a class="smsbtn" href="sms:${escapeHtml(order.customer_phone)}?&body=${encodeURIComponent(`Hi ${order.customer_name || ''}! Your FreshHop delivery fee is $${fee.toFixed(2)}. Pay here: ${url}`)}">Text link to customer</a>`
      : '';
    box.innerHTML = `Delivery fee prepay — send this to the customer and wait for payment before picking up:<br><a class="paybtn" href="${url}" target="_blank">Open payment link</a>${sms}<br><small>After they pay, tap "${actionLabel(order)}".</small>`;
  }
  async function createOrder(){
    const statusEl = document.getElementById('new-order-status');
    const btn = document.getElementById('create-order');
    const feeVal = parseFloat(document.getElementById('f-fee').value);
    const payload = {
      order_type: 'shopping_list',
      status: 'confirmed',
      customer_name: document.getElementById('f-name').value.trim() || null,
      customer_phone: document.getElementById('f-phone').value.trim() || null,
      store_name: document.getElementById('f-store').value.trim() || null,
      pickup_code: document.getElementById('f-code').value.trim() || null,
      pickup_window: document.getElementById('f-window').value.trim() || null,
      delivery_address: document.getElementById('f-address').value.trim() || null,
      mode: document.getElementById('f-mode').value,
      final_total: isNaN(feeVal) ? 9.99 : feeVal
    };
    if(!payload.customer_name){ showMsg(statusEl, 'Enter the customer name.', false); return; }
    btn.disabled = true;
    showMsg(statusEl, 'Creating order…', true);
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/orders`, {
        method: 'POST',
        headers: { ...headers, 'Prefer': 'return=representation' },
        body: JSON.stringify(payload)
      });
      if(!res.ok) throw new Error(await res.text());
      ['f-name','f-phone','f-store','f-code','f-window','f-address'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('f-fee').value = '9.99';
      showMsg(statusEl, 'Order created.', true);
      loadOrders();
    } catch(err){
      showMsg(statusEl, 'Could not create order. If this is the first run, make sure the new columns exist (setup step 2).', false);
    }
    btn.disabled = false;
  }
  async function confirmFeeAndSendLink(order, feeInput, statusMsg, confirmBtn, payLinkBox, card){
    const fee = feeInput ? parseFloat(feeInput.value) : Number(order.final_total || 0);
    if(isNaN(fee) || fee < 0){ showMsg(statusMsg, 'Enter a valid fee.', false); return; }
    confirmBtn.disabled = true;
    showMsg(statusMsg, 'Confirming fee…', true);
    try {
      const orderRes = await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${order.id}`, {
        method: 'PATCH',
        headers: { ...headers, 'Prefer': 'return=minimal' },
        body: JSON.stringify({ final_total: fee, status: 'awaiting_payment' })
      });
      if(!orderRes.ok) throw new Error('order update failed');
      order.status = 'awaiting_payment';
      order.final_total = fee;
      showMsg(statusMsg, `Fee confirmed at $${fee.toFixed(2)} — creating payment link…`, true);
      const linkRes = await fetch('/.netlify/functions/create-payment-link', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ order_id: order.id })
      });
      const linkData = await linkRes.json();
      if(linkData.error){
        showMsg(statusMsg, `Fee confirmed, but payment link failed: ${linkData.error}`, false);
        confirmBtn.disabled = false;
      } else {
        order.payment_link_url = linkData.payment_link_url;
        showMsg(statusMsg, `Fee confirmed at $${fee.toFixed(2)} — awaiting payment. Do NOT pick up yet.`, true);
        const newCard = renderOrderCard(order);
        card.replaceWith(newCard);
        newCard.querySelector('.order-body').classList.add('open');
      }
    } catch(err){
      showMsg(statusMsg, 'Something went wrong. Please try again.', false);
      confirmBtn.disabled = false;
    }
  }
  async function checkPaymentAndDeliver(order, statusMsg, confirmBtn, card){
    showMsg(statusMsg, 'Checking payment status…', true);
    confirmBtn.disabled = true;
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${order.id}&select=payment_status`, { headers });
      if(!res.ok) throw new Error();
      const rows = await res.json();
      const paymentStatus = rows[0] && rows[0].payment_status;
      if(paymentStatus === 'paid'){
        const nextStatus = order.mode === 'pickup' ? 'ready' : 'out_for_delivery';
        const updateRes = await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${order.id}`, {
          method: 'PATCH',
          headers: { ...headers, 'Prefer': 'return=minimal' },
          body: JSON.stringify({ status: nextStatus })
        });
        if(!updateRes.ok) throw new Error();
        showMsg(statusMsg, nextStatus === 'out_for_delivery' ? 'Payment confirmed — go pick up the order and deliver it.' : 'Payment confirmed — order is ready for customer pickup.', true);
        setTimeout(loadOrders, 2000);
      } else {
        showMsg(statusMsg, `Not paid yet (status: ${paymentStatus || 'unknown'}). Ask the customer to complete the payment link, then check again.`, false);
        confirmBtn.disabled = false;
      }
    } catch(err){
      showMsg(statusMsg, 'Could not check payment. Please try again.', false);
      confirmBtn.disabled = false;
    }
  }
  function showMsg(el, msg, ok){
    el.textContent = msg;
    el.className = 'status show ' + (ok ? 'ok' : 'err');
  }
  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }
  loadOrders();
</script>
</body>
</html>
